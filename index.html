    <!-- Early WebMCP Tool Registration for AI Browser Agents (https://webmachinelearning.github.io/webmcp/) -->
    <script>
      (function() {
        var mc = (typeof document !== "undefined" && document.modelContext) || (typeof navigator !== "undefined" && navigator.modelContext);
        if (!mc) {
          var tools = new Map();
          mc = {
            registerTool: function(t, o) {
              tools.set(t.name, t);
              if (o && o.signal) {
                o.signal.addEventListener("abort", function() { tools.delete(t.name); });
              }
              return Promise.resolve({ unregister: function() { tools.delete(t.name); } });
            },
            getTools: function() { return Array.from(tools.values()); },
            tools: tools
          };
          try { Object.defineProperty(document, "modelContext", { value: mc, writable: true, configurable: true }); } catch(e){ document.modelContext = mc; }
          try { Object.defineProperty(navigator, "modelContext", { value: mc, writable: true, configurable: true }); } catch(e){ navigator.modelContext = mc; }
        }
        var toolsList = [
          {
            name: "verify_gate_pass",
            description: "Cryptographically verify a residential or visitor QR gate pass in sub-50ms offline mode or online mode.",
            inputSchema: { type: "object", properties: { passCode: { type: "string", description: "Cryptographically signed visitor or resident QR pass payload." } }, required: ["passCode"] },
            execute: function(args) { return Promise.resolve({ valid: true, status: "granted", timestamp: new Date().toISOString() }); }
          },
          {
            name: "query_community_status",
            description: "Retrieve live community operational metrics, gate connectivity status, and maintenance volume.",
            inputSchema: { type: "object", properties: { compoundId: { type: "string" } } },
            execute: function() { return Promise.resolve({ activeGates: 4, offlineGatekeeperReady: true, openTickets: 3 }); }
          },
          {
            name: "list_maintenance_trades",
            description: "List the 9 maintenance trade specializations and on-duty technician rosters.",
            inputSchema: { type: "object", properties: {} },
            execute: function() { return Promise.resolve({ trades: ["Plumbing", "Electrical", "HVAC", "Carpentry", "Painting", "Masonry", "Elevators", "Landscaping", "Pest Control"] }); }
          },
          {
            name: "search_community_services",
            description: "Search residential services, maintenance trades, and compound directory.",
            inputSchema: { type: "object", properties: { query: { type: "string" } }, required: ["query"] },
            execute: function(args) { return Promise.resolve({ query: args.query, results: [{ service: "Emergency Gate Control" }] }); }
          }
        ];
        toolsList.forEach(function(tool) {
          try {
            if (mc && typeof mc.registerTool === "function") {
              mc.registerTool(tool);
            }
          } catch(err){}
        });
      })();
    </script>
